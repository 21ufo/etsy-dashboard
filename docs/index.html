<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Etsy Shop Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #1a1a2e;
      --card-bg: #16213e;
      --text: #ffffff;
      --text-muted: #8892b0;
      --accent-purple: #8A2BE2;
      --accent-teal: #20B2AA;
      --success: #4caf50;
      --warning: #ff9800;
      --danger: #f44336;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    .etsy-logo {
      width: 48px;
      height: 48px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, serif;
      font-weight: bold;
      color: #000;
      font-size: 18px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 700;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .kpi-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .kpi-card.purple { border-top: 4px solid var(--accent-purple); }
    .kpi-card.teal { border-top: 4px solid var(--accent-teal); }
    .kpi-card.green { border-top: 4px solid var(--success); }
    .kpi-card.orange { border-top: 4px solid var(--warning); }
    .kpi-value {
      font-size: 32px;
      font-weight: 700;
      margin: 8px 0;
    }
    .kpi-label {
      color: var(--text-muted);
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .kpi-icon {
      font-size: 24px;
      margin-bottom: 4px;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 24px;
      margin-bottom: 32px;
    }
    .chart-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
    }
    .chart-card h3 {
      margin-bottom: 16px;
      font-size: 16px;
      color: var(--text-muted);
    }
    .chart-container {
      position: relative;
      height: 250px;
    }

    .chart-full {
      grid-column: 1 / -1;
    }

    .summary-table {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      width: 100%;
    }
    .summary-table h3 {
      margin-bottom: 16px;
      color: var(--text-muted);
    }
    .summary-table table {
      width: 100%;
      border-collapse: collapse;
    }
    .summary-table td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .summary-table td:first-child {
      color: var(--text-muted);
    }
    .summary-table td:last-child {
      text-align: right;
      font-weight: 600;
    }

    @media (max-width: 768px) {
      .charts-grid { grid-template-columns: 1fr; }
      body { padding: 16px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="etsy-logo">E</div>
    <h1>Etsy Shop Dashboard</h1>
  </div>

  <div class="kpi-grid">
    <div class="kpi-card purple">
      <div class="kpi-icon">💰</div>
      <div class="kpi-label">Total Revenue</div>
      <div class="kpi-value" id="kpi-revenue">$9,100</div>
    </div>
    <div class="kpi-card teal">
      <div class="kpi-icon">📦</div>
      <div class="kpi-label">Orders</div>
      <div class="kpi-value" id="kpi-orders">400</div>
    </div>
    <div class="kpi-card green">
      <div class="kpi-icon">🎯</div>
      <div class="kpi-label">Conversion</div>
      <div class="kpi-value" id="kpi-conversion">2.52%</div>
    </div>
    <div class="kpi-card orange">
      <div class="kpi-icon">👁️</div>
      <div class="kpi-label">Views</div>
      <div class="kpi-value" id="kpi-views">2,520</div>
    </div>
  </div>

  <div class="charts-grid">
    <div class="chart-card">
      <h3>📊 Sales Breakdown</h3>
      <div class="chart-container">
        <canvas id="chart-sales"></canvas>
      </div>
    </div>

    <div class="chart-card">
      <h3>📈 Monthly Sales Trends</h3>
      <div class="chart-container">
        <canvas id="chart-monthly"></canvas>
      </div>
    </div>

    <div class="chart-card chart-full">
      <h3>🌊 Traffic Over Time</h3>
      <div class="chart-container">
        <canvas id="chart-traffic"></canvas>
      </div>
    </div>
  </div>

  <div class="summary-table">
    <h3>📋 Summary Stats</h3>
    <table>
      <tr><td>📦 Total Items Sold</td><td>21.88</td></tr>
      <tr><td>👁️ Product Views</td><td>22.80</td></tr>
      <tr><td>💵 Average Order Value</td><td>$20.34</td></tr>
      <tr><td>↩️ Returns</td><td>$2.14</td></tr>
      <tr><td>📢 Ad Spend</td><td>$1.13</td></tr>
    </table>
  </div>

  <script>
    Chart.defaults.color = '#8892b0';
    Chart.defaults.borderColor = 'rgba(255,255,255,0.1)';

    // Sales Breakdown
    new Chart(document.getElementById('chart-sales'), {
      type: 'doughnut',
      data: {
        labels: ['Sales (70%)', 'Other (30%)'],
        datasets: [{
          data: [70, 30],
          backgroundColor: ['#8A2BE2', '#20B2AA'],
          borderWidth: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { padding: 20 } } }
      }
    });

    // Monthly Trends
    new Chart(document.getElementById('chart-monthly'), {
      type: 'bar',
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr'],
        datasets: [
          { label: 'Revenue ($)', data: [2000, 450, 200, 100], backgroundColor: '#8A2BE2' },
          { label: 'Orders', data: [2000, 300, 150, 80], backgroundColor: '#20B2AA' }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' } },
          x: { grid: { display: false } }
        }
      }
    });

    // Traffic Over Time
    new Chart(document.getElementById('chart-traffic'), {
      type: 'line',
      data: {
        labels: ['W1', 'W2', 'W3', 'W4', 'W5', 'W6', 'W7', 'W8', 'W9', 'W10'],
        datasets: [{
          label: 'Views',
          data: [10, 25, 45, 60, 80, 95, 120, 150, 180, 220],
          borderColor: '#20B2AA',
          backgroundColor: 'rgba(32,178,170,0.1)',
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        scales: {
          y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.1)' } },
          x: { grid: { display: false } }
        }
      }
    });
  </script>

</body>
</html>
